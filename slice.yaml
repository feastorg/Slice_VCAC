# slice.yaml: BREAD Slice manifest, schema 2.0 (bread-infra spec/slice/slice-manifest-spec.md)
schema_version: '2.0'
id: slice-vcac
name: AC Voltage and Current Sensor
summary: Isolated AC voltage (ZMPT101B) and non-invasive current (SCT-013) measurement slice.
category: sensing
status: concept
hardware:
  hw_gen_current: 3
  interface: SI1
  pcb:
    layers: 2
    dimensions: 70mm x 100mm
    thickness: 1.6mm
  mounting:
    pattern: slice-S-v0
  mcu:
    form_factor: nano
interfaces:
  host:
    address_default: null
metadata:
  tags:
  - power-monitoring
  - ac-voltage
  - ac-current
  - energy-monitoring
  - isolation
